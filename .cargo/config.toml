# 团队统一构建配置。放在仓库里而不是 ~/.cargo/config.toml，保证 CI 与本地一致。
#
# 注意：本文件不会覆盖用户 registry 镜像（公司/国内镜像通常写在全局配置里）。

[build]
# PinBridge 需要 64 位宿主；x86 目标由 Pin 的 32 位 JIT 在独立进程里处理。
target-dir = "target"

[alias]
# --- 开发日常 -------------------------------------------------------------
b         = "build --workspace --all-targets"
c         = "check --workspace --all-targets"
t         = "test --workspace --all-targets"
lint      = "clippy --workspace --all-targets --all-features -- -D warnings"
fmt-all   = "fmt --all"
fmt-check = "fmt --all -- --check"
# --- 质量门禁（与 CI 一一对应）-------------------------------------------
gate      = ["fmt-check", "lint", "t", "doc"]
doc       = "doc --workspace --no-deps --document-private-items"
# --- 产物 -----------------------------------------------------------------
agent     = "build -p pinbridge-agent --release"
abi       = "build -p pinbridge-cabi --release"
dist      = "build --workspace --release"

[target.x86_64-pc-windows-msvc]
# 与 pinbridge.dll 的 C ABI 一致：静态 CRT，避免把 vcruntime 依赖带进目标进程
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
PINBRIDGE_LOG = "info"
# 测试**串行**跑。
#
# 原因不是"习惯"：agent 的导出面（`pb_*`）是**进程级单例**——事件队列、暂停状态、
# 轨迹录制器、断点表、CPython 解释器都只有一份。测试默认每个用例一条线程并行，
# 于是任何共享了这些状态的用例都会互相干扰。
#
# 这个坑咬过三次，每次的现场都离原因很远：
#   1. 共享事件队列 → 断言"恰好取到 1 条"随机失败；
#   2. 共享暂停状态 → 后面的用例取到空批次，错误信息里没有任何线索；
#   3. 共享录制器   → 另一个用例推的事件混进本用例的轨迹，条数翻倍。
#
# 前两次的修法是"记得在用例里加 `GLOBAL_STATE_LOCK`"——而这条纪律在**新加的
# 用例忘了加锁**时会静默失效，失效的表现又是随机失败。与其依赖记忆，
# 不如让整个测试进程单线程：代价是几秒，换来的是"失败一定意味着代码有问题"。
RUST_TEST_THREADS = "1"
