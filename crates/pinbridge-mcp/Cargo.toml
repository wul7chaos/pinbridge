[package]
name = "pinbridge-mcp"
description = "MCP stdio 服务：把 HubService 的能力暴露给 AI 客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[lib]
name = "pinbridge_mcp"
path = "src/lib.rs"

[[bin]]
name = "pinbridge-mcp"
path = "src/main.rs"

[dependencies]
pinbridge-client.workspace = true
pinbridge-core.workspace = true
pinbridge-hub.workspace = true
pinbridge-proto.workspace = true
pinbridge-trace.workspace = true
serde.workspace = true
serde_json.workspace = true

# 只有测试需要 agent：端到端用例要在同一个进程里把"目标侧链路"真起起来
# （`pb_link_start`），再把 MCP 侧连过去。生产路径不依赖 agent crate。
[dev-dependencies]
pinbridge-agent.workspace = true

[lints]
workspace = true
