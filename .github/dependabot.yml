# Dependabot 配置。
#
# 策略：**依赖更新单独成 PR，永不与功能改动混在一起**。
# 理由很实际：一次"顺手升级依赖"的合并，会让 VMP 对抗场景下的行为变化
# 无法归因——是样本变了还是依赖变了？
#
# 分组规则：把 RustCrypto 全家桶与 serde 生态分开，避免一个 PR 同时动
# 五个 crate 导致 review 只能"看 CI 绿了就点同意"。
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: ["deps", "rust"]
    commit-message:
      prefix: "build(deps)"
      include: scope
    groups:
      serde:
        patterns: ["serde", "serde_json"]
        update-types: ["minor", "patch"]
      crypto:
        patterns: ["sha2", "digest", "generic-array", "typenum", "crypto-common"]
      dev-tools:
        patterns: ["thiserror", "thiserror-impl"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    labels: ["deps", "python"]
    commit-message:
      prefix: "build(deps)"
    groups:
      python-dev:
        patterns: ["pytest*", "mypy*", "ruff*"]

  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: monthly
    labels: ["deps", "desktop"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Tauri 大版本升级需要人工评估（它决定桌面端的运行方式）
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["deps", "ci"]
    commit-message:
      prefix: "ci(deps)"
