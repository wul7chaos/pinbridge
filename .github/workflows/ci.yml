name: CI

# 触发策略：
#  * push 到 main：全量跑
#  * PR：全量跑（这是唯一的合并门禁）
#  * 手动：随时可跑（排查"是不是 CI 环境问题"时用）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的运行，省 runner 也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI 上不允许任何隐式网络行为（依赖已在 Cargo.lock 钉死）
  CARGO_NET_OFFLINE: "false"

jobs:
  fmt:
    name: 格式（rustfmt）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint（clippy -D warnings）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 读取仓库钉住的工具链
        run: rustup show && rustc --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - name: 文档测试（保证文档里的示例至少能编译）
        run: cargo test --workspace --doc

  e2e:
    name: 端到端自检（pinbridge demo）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 跑自检（失败即失败，不允许"环境问题"放过）
        run: cargo run --quiet -p pinbridge-cli -- demo --trace-dir "${{ runner.temp }}/pinbridge-traces"
      - name: 用 CLI 回读刚生成的轨迹
        shell: bash
        run: |
          set -euo pipefail
          trace=$(find "${{ runner.temp }}/pinbridge-traces" -name '*.pbt' | head -n 1)
          test -n "$trace" || { echo "demo 没有产出轨迹"; exit 1; }
          cargo run --quiet -p pinbridge-cli -- replay "$trace" --head 5

  python:
    name: Python 侧（跨语言一致性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 先构建 Rust CLI：跨语言用例需要它生成真实轨迹
      - run: cargo build -p pinbridge-cli
      - name: 安装并运行
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: ruff（静态检查）
        working-directory: python
        run: ruff check . && ruff format --check .
      - name: mypy（严格模式）
        working-directory: python
        run: mypy

  desktop:
    name: 桌面端（NDJSON 客户端逻辑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只跑不需要依赖的那部分：客户端逻辑是纯 ESM，Node 自带的测试运行器就能验证。
      # 装配 React/Tauri 需要 registry，而且需要系统 WebView —— 那部分刻意不进 CI
      # （见 apps/desktop/README.md 的理由：会把门禁从几十秒变成十分钟）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test（分帧 / 关联 / 错误传播 / 回环约束）
        working-directory: apps/desktop
        # 不传路径：用自动发现（Node 22 与更新版本对"目录参数"的处理不同，
        # 传目录在旧版本上会被当成模块名 ⇒ "在我机器上是好的"）。
        run: node --test

  desktop-frontend:
    name: 桌面端（类型检查 + 前端构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 用 npm 而不是 pnpm：pnpm 11 会在 `install`/`lint` 前先跑依赖检查，而它因为
      # "ignored build scripts"（esbuild 的 postinstall 被默认拦下）以 exit=1 结束，
      # type check 根本没机会跑。npm 不做这层拦阻，验证的是同一件事。
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: tsc --noEmit（类型检查）
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: vite build（前端真构建一次）
        working-directory: apps/desktop
        run: npx vite build

  native:
    name: native 层（C++ 桥接 + ABI 自检）
    runs-on: windows-latest
    # 这个 job 是"Hub ↔ agent"链路的**唯一强制点**：
    # test job 里那条集成测试在没有 DLL 时会跳过（本地开发者多数没装 C++ 工具链），
    # 而这里必须真的构建出 pinbridge_bridge.dll 并让加载器驱动它。
    # 缺少任何一步都会失败，而不是悄悄变绿。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 agent DLL（cdylib）
        run: cargo build -p pinbridge-agent
      - name: 构建 native 层并跑 CTest
        shell: pwsh
        run: ./scripts/build-native.ps1 -RequireAgent
      - name: Hub 侧加载器端到端（真实加载 DLL）
        shell: pwsh
        env:
          # 设了它，测试就**不允许**跳过：环境没准备好 = 失败
          PINBRIDGE_REQUIRE_NATIVE: "1"
          PINBRIDGE_BRIDGE_DLL: ${{ github.workspace }}/native/build/pinbridge_bridge.dll
        run: cargo test -p pinbridge-sys --test bridge_end_to_end -- --nocapture

  native-linux:
    name: native 头文件可移植性（CMake + CTest）
    runs-on: ubuntu-latest
    # 只做一件事：用 g++ 构建并运行 ABI 自检。
    # 目的是守住 `pinbridge.h` 的可移植性——它被 C++ 与 Rust 双侧包含，
    # 一旦有人在里面塞进 Win32 专有的东西，这条 10 秒的 job 会立刻发现，
    # 而不是等到某个 Linux 贡献者打不开项目。
    steps:
      - uses: actions/checkout@v4
      - name: 配置（桥接层在非 Windows 上会被跳过）
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: 构建
        run: cmake --build native/build
      - name: CTest
        run: ctest --test-dir native/build --output-on-failure

  changelog:
    name: 变更日志守卫
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 代码改动必须伴随 CHANGELOG 条目
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "改动文件："; echo "$changed"
          if echo "$changed" | grep -qE '^(crates/|native/|python/src/|apps/)'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
              echo "::error::改动了代码但没有更新 CHANGELOG.md（见 docs/dev/workflow.md）"
              exit 1
            fi
          fi
          echo "OK"

  commit-lint:
    name: 提交信息规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 Conventional Commits
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .{1,72}$'
          failed=0
          for subject in $(git log --format=%s "origin/${{ github.base_ref }}..HEAD"); do
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::提交信息不符合规范: $subject"
              failed=1
            fi
          done
          exit $failed
