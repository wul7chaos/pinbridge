name: 发布

# 触发：打 tag（例如 v0.1.0）。发布流程见 docs/dev/build-and-release.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: 冒烟测试（发布物必须能跑）
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/pinbridge${{ matrix.ext }}"
          test -x "$bin" || test -f "$bin"
          "$bin" version
          "$bin" tools | head -n 5

      # 用 pwsh + Compress-Archive，而不是 `zip`：
      # Windows runner 上没有 `zip`，之前这一步以 exit 127（命令不存在）失败 ——
      # 而这条流程在第一次真跑之前没人发现（见 docs/dev/build-and-release.md 的说明）。
      - name: 打包
        shell: pwsh
        run: |
          $name = "pinbridge-$($env:GITHUB_REF_NAME ?? 'dev')-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          foreach ($bin in @('pinbridge', 'pinbridge-mcp')) {
            $src = "target/${{ matrix.target }}/release/$bin${{ matrix.ext }}"
            if (Test-Path $src) { Copy-Item $src "dist/$name/" -Force }
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/" -Force
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          "ARTIFACT=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  desktop-bundle:
    name: 桌面安装器（NSIS）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # 打包前先验：装不上安装器的原因最好是编译错误，而不是上线后才发现界面是坏的。
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit
      - name: 前端用例
        working-directory: apps/desktop
        run: node --test

      - name: 打包（NSIS 安装器）
        working-directory: apps/desktop
        run: pnpm tauri build

      # 注意：**不要**设 working-directory。产物从仓库根算起是
      # target/release/bundle/nsis（第一次写成了 ../target，从 apps/desktop 出发
      # 少了一层，于是这一步找不到文件而失败）。
      - name: 校验和
        shell: pwsh
        run: |
          $dir = 'target/release/bundle/nsis'
          if (-not (Test-Path $dir)) { throw "没有找到安装器输出目录：$dir" }
          $files = Get-ChildItem $dir -Filter '*.exe'
          if ($files.Count -eq 0) { throw "$dir 里没有 .exe" }
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            "{0}  {1:N2} MiB  sha256={2}" -f $f.Name, ($f.Length / 1MB), $hash |
              Tee-Object -FilePath "$dir/SHA256SUMS.txt" -Append
          }
          Get-Content "$dir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [build, desktop-bundle]
    if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 从 CHANGELOG 抽取本版说明
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "CHANGELOG 里没有 ${version} 的条目" >&2; exit 1; fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # 命令行 zip + 桌面安装器（安装器是单个文件，落在 dist/ 根下）。
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.txt
          draft: false
          prerelease: false
